# Nginx Configuration for ERP (Hostinger VPS KVM 4)
# Save to: /etc/nginx/sites-available/erp
# Symlink: ln -s /etc/nginx/sites-available/erp /etc/nginx/sites-enabled/

# 1. Redirect HTTP to HTTPS (Will be auto-configured by certbot, or manual)
server {
    listen 80;
    listen [::]:80;
    server_name erp.arabseason.info; # <-- Replace with your domain or VPS IP

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.arabseason.info; # <-- Replace with your domain

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/erp.arabseason.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.arabseason.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Performance & Upload limits (Crucial for base64 attachments & job order images)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Static Build Root (React/Vite)
    root /var/www/erp/frontend/dist;
    index index.html;

    # Frontend SPA Routing (redirect all non-file routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-cache";
    }

    # Vite Static Assets Caching (Fingerprinted assets get 1 year cache)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Django Static Files (collected via python manage.py collectstatic)
    location /static/ {
        alias /var/www/erp/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API Reverse Proxy -> Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Generous timeouts for large PDF generation or data imports
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Django Admin Interface
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

